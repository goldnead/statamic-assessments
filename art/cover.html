<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #1A4D13 0%, #0E2F09 55%, #050B04 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #C9EEC4; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #44B234; box-shadow: 0 0 18px #44B234; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#C9EEC4,#94DD88); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #D6E5D2; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #C9EEC4; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #44B23447, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Assessments</span></h1>
      <p class="sub">A questionnaire with points per answer and result levels by score.</p>
      <div class="badges">
        <span class="badge">Points per answer</span>
        <span class="badge">Result levels</span>
        <span class="badge">Automation trigger</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#44B234"/><stop offset="1" stop-color="#246619"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#153F0F" flood-opacity="0.34"/>
          </filter>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- a graded dial with the needle stopped inside the third band: points
             become a level, and a dial shows a scale and a place on it at once. -->
        <g filter="url(#sh)">
          <path d="M80 347 A176 176 0 0 1 432 347 L368 347 A112 112 0 0 0 144 347 Z" fill="#FFFFFF"/>
        </g>
        <g fill="url(#bg)">
          <circle cx="154.2" cy="245.2" r="12"/>
          <circle cx="256" cy="203" r="12"/>
          <circle cx="357.8" cy="245.2" r="12"/>
        </g>
        <path d="M256 347 L306.6 277.4" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
        <circle cx="256" cy="347" r="34" fill="#FFFFFF"/>
        <circle cx="256" cy="347" r="14" fill="url(#bg)"/>
      </svg>
    </div>
  </div>
</body>
</html>
