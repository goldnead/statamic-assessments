<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44B234"/>
      <stop offset="1" stop-color="#246619"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#153F0F" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- a graded dial with the needle stopped inside the third band. What this
       addon does is turn points into a level, and a dial is the one glyph that
       shows a scale and a place on it at the same time. A clipboard would have
       said "form", which Activity, Invoices and Email Templates already draw as
       a sheet with lines; a chart would have said Insights. The three marks are
       the result levels, not decoration. -->
  <g filter="url(#sh)">
    <path d="M80 347 A176 176 0 0 1 432 347 L368 347 A112 112 0 0 0 144 347 Z" fill="#FFFFFF"/>
  </g>

  <!-- the level marks -->
  <g fill="url(#bg)">
    <circle cx="154.2" cy="245.2" r="12"/>
    <circle cx="256" cy="203" r="12"/>
    <circle cx="357.8" cy="245.2" r="12"/>
  </g>

  <!-- the needle. Its round cap has to stop clear of the scale's inner edge, or
       the two whites merge and the dial loses its needle. -->
  <path d="M256 347 L306.6 277.4" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <circle cx="256" cy="347" r="34" fill="#FFFFFF"/>
  <circle cx="256" cy="347" r="14" fill="url(#bg)"/>
</svg>
